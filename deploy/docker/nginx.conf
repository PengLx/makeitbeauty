# MakeItBeauty web front (architecture.md §4): static SPA + /v1 reverse proxy
# to the api service. Installed as /etc/nginx/conf.d/default.conf, so this
# file's top level is nginx's http context. One server block serves both
# planes — a single public domain covers the editor and the render API, and
# the GitHub Action's api-url is just that domain.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Design documents can embed data: URIs; give /v1 request bodies headroom
    # (the renderer itself caps bodies at 8 MB).
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Container health endpoint (compose healthcheck / Coolify). Does not
    # collide with the API: only /v1/ is proxied.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Public API plane. The Docker embedded DNS resolver plus the variable
    # indirection makes nginx re-resolve "api" per request instead of caching
    # the container IP at startup (containers get new IPs on redeploy).
    # With a variable proxy_pass and no URI part, the original request URI
    # (/v1/...) is passed through unchanged; method, headers, and body are
    # preserved by proxying.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /v1/ {
        set $api_upstream http://api:7800;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Renders run multiple satori passes and may wait on connector
        # snapshots — allow well over a minute before giving up.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Vite emits content-hashed filenames under /assets/ — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app shell must revalidate so deploys are picked up promptly.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every other path serves the app shell.
    location / {
        try_files $uri /index.html;
    }
}
