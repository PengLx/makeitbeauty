<!doctype html>
<!--
  OpenGraph image source: centers the composed showcase render (real product
  output, see generate-showcase.ts) on the landing page's dark ground with a
  wordmark. Screenshot to apps/web/public/og.png (1200×630) from repo root:

    google-chrome --headless=new --disable-gpu --no-sandbox \
      --screenshot=apps/web/public/og.png --window-size=1200,630 \
      --virtual-time-budget=6000 file://$PWD/apps/web/scripts/og.html
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0d1117;
        overflow: hidden;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .wrap {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 430px;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #e6edf3;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0;
        color: #e6edf3;
        font-size: 40px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      h1 span {
        background: linear-gradient(90deg, #67e8f9, #38bdf8, #e879f9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0;
        color: #8b949e;
        font-size: 19px;
        line-height: 1.5;
      }
      img {
        width: 560px;
        height: auto;
        border-radius: 14px;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="mark">
          <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="0" y="0" width="7" height="7" rx="1.8" fill="#39d353" />
            <rect x="9" y="0" width="7" height="7" rx="1.8" fill="#26a641" />
            <rect x="0" y="9" width="7" height="7" rx="1.8" fill="#006d32" />
            <rect x="9" y="9" width="7" height="7" rx="1.8" fill="#0e4429" />
          </svg>
          MakeItBeauty
        </div>
        <h1>Your GitHub profile, <span>drawn from live data</span></h1>
        <p>Visual editor · live data · your repo stays in control</p>
      </div>
      <img src="../src/assets/showcase/profile-card.svg" alt="" />
    </div>
  </body>
</html>
